[package]
name = "valet-linux-plus-desktop"
version = "0.0.1"
description = "Optional desktop UI for valet-linux-plus"
authors = ["Fernando Ebert"]
license = "MIT"
repository = "https://github.com/FernandoEbert/valet-linux-plus-desktop"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin targets.
name = "valet_linux_plus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
