name: Release

# Push a tag `vX.Y.Z` whose version matches package.json / Cargo.toml / tauri.conf.json
# (`node scripts/version.mjs X.Y.Z`). The release is created as a draft: review, then publish.
# `vX.Y.Z-rc.N` tags make a pre-release with the AppImage and .deb only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported base: the AppImage and packages then run on newer glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag matches the app version
        run: node scripts/version.mjs --tag "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts (.sig) and latest.json for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Valet Linux+ Desktop ${{ github.ref_name }}
          releaseBody: |
            Desktop UI for [valet-linux-plus](https://github.com/FernandoEbert/valet-linux-plus). Requires Valet installed through Composer.

            - **AppImage**: `chmod +x` and run. Updates itself from the app.
            - **.deb** (Ubuntu/Debian) / **.rpm** (Fedora): also install the polkit policy, so the password is asked once per session with the app's own prompt.

            See the README for details.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          # RPM versions can't contain '-', so pre-releases (vX.Y.Z-rc.N) skip the .rpm.
          args: ${{ contains(github.ref_name, '-') && '--bundles appimage,deb' || '' }}
